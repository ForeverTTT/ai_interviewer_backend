name: Sync discovered company career sites

on:
  schedule:
    # 每 3 小时处理最久未检查的一批来源；控制批量大小，约一天轮转覆盖活跃目录。
    - cron: '47 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-all-company-jobs
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove expired jobs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Remove jobs past their China-time deadline
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run jobs:expire

  sync:
    name: Sync ${{ matrix.platform }} sources
    needs: cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: moka
            limit: 90
          - platform: hotjob
            limit: 30
          - platform: feishu-career
            limit: 25
          - platform: zhiye
            limit: 110

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Sync oldest source snapshots first
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/syncDiscoveredCompanyJobs.js --platform ${{ matrix.platform }} --limit-sources ${{ matrix.limit }} --allow-source-failures
