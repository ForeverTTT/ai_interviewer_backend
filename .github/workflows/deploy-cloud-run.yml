name: Deploy backend to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

jobs:
  test_and_deploy:
    name: Test and deploy production backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Validate deployment configuration
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for name in GCP_PROJECT_ID GCP_REGION CLOUD_RUN_SERVICE WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub production variable/secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Prepare deployment metadata
        id: metadata
        shell: bash
        run: |
          echo "deployed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cloud-run-source-deploy/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Artifact Registry
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
        run: echo "$ACCESS_TOKEN" | docker login --username oauth2accesstoken --password-stdin "$REGISTRY"

      - name: Build and push backend image
        shell: bash
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: |
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy image to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          image: ${{ steps.metadata.outputs.image }}
          env_vars_update_strategy: merge
          env_vars: |-
            APP_COMMIT_SHA=${{ github.sha }}
            APP_DEPLOYED_AT=${{ steps.metadata.outputs.deployed_at }}
          flags: >-
            --execution-environment=gen2
            --port=8080
            --cpu=1
            --memory=512Mi
            --min-instances=0
            --max-instances=2
            --concurrency=20

      - name: Verify deployed revision
        shell: bash
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          health_url="${SERVICE_URL%/}/api/health"
          health="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$health_url")"
          echo "$health"
          node -e '
            const health = JSON.parse(process.argv[1]);
            const expected = process.argv[2];
            if (health.status !== "ok") throw new Error("Cloud Run health check is not ok");
            if (health.commit !== expected) {
              throw new Error(`Expected commit ${expected}, received ${health.commit || "missing"}`);
            }
          ' "$health" "$EXPECTED_COMMIT"

      - name: Publish deployment URL
        run: echo "Cloud Run deployment verified at ${{ steps.deploy.outputs.url }}"
