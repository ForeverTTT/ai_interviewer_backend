# The frontend lives in frontend/ inside this monorepo.
name: Deploy frontend to Firebase Hosting on PR

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/firebase-hosting-pull-request.yml'

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        env:
          # The preview- prefix lets analytics queries exclude preview traffic.
          VITE_APP_VERSION: preview-${{ github.event.pull_request.head.sha }}
        run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AIINTERVIEWER_491711_7B1CF }}
          projectId: aiinterviewer-491711-7b1cf
          entryPoint: frontend
